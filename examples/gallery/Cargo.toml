[package]
name = "kobo-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kobo-sdk = { path = "../../crates/kobo-sdk" }

[dev-dependencies]
# The panels the runtime supports, so the reference can be laid out on all of
# them rather than on the one the author happens to own.
kobo-profile = { path = "../../crates/kobo-profile" }
kobo-ui = { path = "../../crates/kobo-ui" }
# The faces the device draws with. The built-in fallback sizes type for a
# 300 ppi panel, so fitting a page on any other density has to measure with
# these instead.
kobo-text = { path = "../../crates/kobo-text" }

[lints]
workspace = true
