[package]
name = "kobo-paperterm"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kobo-sdk = { path = "../../crates/kobo-sdk" }
kobo-json = { path = "../../crates/kobo-json" }

[dev-dependencies]
kobo-profile = { path = "../../crates/kobo-profile" }
kobo-stream = { path = "../../crates/kobo-stream" }
kobo-ui = { path = "../../crates/kobo-ui" }
# The faces the device draws with. The built-in fallback sizes type for a
# 300 ppi panel, so fitting a screen on any other density has to measure with
# these instead.
kobo-text = { path = "../../crates/kobo-text" }

[lints]
workspace = true
