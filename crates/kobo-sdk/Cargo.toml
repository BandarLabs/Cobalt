[package]
name = "kobo-sdk"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Application SDK for declarative Kobo E Ink applications"
documentation = "https://docs.rs/kobo-sdk"

[features]
# On by default, because an application that measures text with different type
# from the runtime measures it wrongly, and the only way to notice is a page
# that loses its last paragraph on the panel and nowhere else.
default = ["text"]
text = ["dep:kobo-text"]

[dependencies]
kobo-policy = { version = "0.3.0", path = "../kobo-policy" }
kobo-protocol = { version = "0.3.0", path = "../kobo-protocol" }
kobo-text = { version = "0.3.0", path = "../kobo-text", optional = true }
kobo-ui = { version = "0.3.0", path = "../kobo-ui" }

[lints]
workspace = true
