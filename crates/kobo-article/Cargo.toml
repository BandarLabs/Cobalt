[package]
name = "kobo-article"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Host only. Turning a web page into a book happens on the owner's computer,
# where an HTML5 parser and image codecs cost nothing; no reader or app build
# depends on this crate.
[dependencies]
# Reader-mode extraction. Pinned exactly: a new release can change which parts
# of a page count as the article, and the fixtures here are what decide that.
dom_smoothie = "=0.19.0"
dom_query = { version = "=0.29.0", default-features = false }
image = { version = "=0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
kobo-doc = { path = "../kobo-doc" }
kobo-net = { path = "../kobo-net" }
kobo-protocol = { path = "../kobo-protocol" }

[lints]
workspace = true
