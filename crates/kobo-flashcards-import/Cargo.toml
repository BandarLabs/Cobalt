[package]
name = "kobo-flashcards-import"
version = "0.3.10"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "flashcards-import"
path = "src/main.rs"

[dependencies]
anki = { git = "https://github.com/ankitects/anki.git", rev = "9e32ad8849068510a82273889c21b22e1acf0949" }
anki_proto = { git = "https://github.com/ankitects/anki.git", rev = "9e32ad8849068510a82273889c21b22e1acf0949" }
kobo-flashcards-format = { path = "../kobo-flashcards-format" }
kobo-doc = { path = "../kobo-doc" }
kobo-html = { path = "../kobo-html" }
kobo-image = { path = "../kobo-image" }
rusqlite = { version = "0.36.0", features = ["bundled", "collation"] }
serde = "1.0"
serde_json = "1.0.140"
tokio = { version = "1.45", features = ["io-util"] }
unicase = "=2.6.0"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
# The independent host importer uses rustc 1.88; the device workspace stays on 1.85.1.
# Keep the reviewed ICU resolution and require the fixed time parser.
idna_adapter = "=1.2.1"
icu_normalizer = "=2.0.0"
icu_properties = "=2.0.0"
time = "=0.3.47"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[workspace]
resolver = "2"
