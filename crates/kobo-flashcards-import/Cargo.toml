publish = false

[[bin]]
name = "flashcards-import"
path = "src/main.rs"

[dependencies]
kobo-flashcards-format = { path = "../kobo-flashcards-format" }
kobo-html = { path = "../kobo-html" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
