[package]
name = "kobo-cli"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kobo"
path = "src/main.rs"

[dependencies]
kobo-app-store = { path = "../kobo-app-store" }
kobo-sim = { path = "../kobo-sim" }
kobo-image = { path = "../kobo-image" }
kobo-json = { path = "../kobo-json" }
kobo-net = { path = "../kobo-net" }
kobo-stream = { path = "../kobo-stream" }
kobo-doc = { path = "../kobo-doc" }
kobo-frame-host = { path = "../kobo-frame-host" }
kobo-profile = { path = "../kobo-profile" }
ring = "0.17"
rusqlite = { version = "0.37.0", features = ["bundled", "serialize"] }
serde_json = "1.0"

[features]
default = []
# Enables the owner-attended `smoke-display` command. Never enabled by default,
# so a stock `cargo install`/`cargo run` of this CLI cannot touch the display.
device-write = []

[lints]
workspace = true
