[package]
name = "kobo-music-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
blake3 = "1.8.2"
# Host-side only: pages past the reader's decode limit are read whole here and
# scaled down before they are sent. Pinned with the rest of the workspace.
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
kobo-image = { path = "../kobo-image" }
kobo-json = { path = "../kobo-json" }
