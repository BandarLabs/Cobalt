[package]
name = "kobo-opds"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true

# Two dependencies, one per version of the protocol this crate reads: the
# Atom scanner for OPDS 1.2, the JSON reader for OPDS 2.0. Nothing else, by
# the same reasoning as kobo-xml and kobo-json themselves: this reads bytes a
# stranger's server sent, not a place to hang a framework.
[dependencies]
kobo-xml = { path = "../kobo-xml" }
kobo-json = { path = "../kobo-json" }

[lints]
workspace = true
