name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          components: clippy, rustfmt
      - name: Install the ARM cross-compiler the packaging tests look for
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - run: cargo fmt --all -- --check
      - run: node --test tools/*.test.mjs
      - name: Require current generated app pages
        run: |
          node tools/generate-app-pages.mjs
          git diff --exit-code -- docs/apps docs/sitemap.xml
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  device-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          targets: armv7-unknown-linux-musleabihf
      - name: Install the ring C cross-compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - run: cargo check --workspace --all-features --target armv7-unknown-linux-musleabihf
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
      - run: cargo run --locked -p kobo-cli -- app-check --registry apps/catalog.json
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
          CFLAGS_armv7_unknown_linux_musleabihf: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
      - name: Require versions for changed app packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/apps.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha')"
          test -n "$published_sha"
          curl --fail --location --retry 3 \
            --output published-app-catalog.json \
            https://github.com/BandarLabs/Cobalt/releases/download/app-catalog/cobalt-app-catalog.json
          node tools/check-app-versions.mjs \
            --registry apps/catalog.json \
            --published-catalog published-app-catalog.json \
            --base "$published_sha"

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RustSec/advisory-db
          path: advisory-db
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RustSec/advisory-db
          ref: 309ad29d8fe448bf986019e05d47b9e0e29a2218
          path: advisory-db-fallback
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: |
          set +e
          output="$(cargo audit --db advisory-db --no-fetch 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            printf '%s\n' "$output"
          elif printf '%s\n' "$output" | grep -Eq \
            'error loading advisory database|expected RUSTSEC-[0-9-]+ to be in'; then
            printf '%s\n' "$output" >&2
            echo "Current advisory database is malformed; using the last verified snapshot." >&2
            cargo audit --db advisory-db-fallback --no-fetch
          else
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
