name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - name: Install the ARM cross-compiler the packaging tests look for
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  device-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0
          targets: armv7-unknown-linux-musleabihf
      - name: Install the ring C cross-compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - run: cargo check --workspace --all-features --target armv7-unknown-linux-musleabihf
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc

  advisories:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
