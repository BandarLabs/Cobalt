name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          components: clippy, rustfmt
      - name: Install the ARM cross-compiler the packaging tests look for
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - run: cargo fmt --all -- --check
      - name: Test the POSIX host installer
        run: |
          sh -n install.sh docs/install.sh tools/installer-test.sh tools/build-host-release.sh
          tools/installer-test.sh
      - run: node --test tools/*.test.mjs
      - name: Validate generated app pages
        run: |
          node tools/generate-app-pages.mjs
          git diff --exit-code -- docs/apps docs/sitemap.xml
          test -z "$(git status --porcelain --untracked-files=all -- docs/apps docs/sitemap.xml)"
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  device-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          targets: armv7-unknown-linux-musleabihf
      - name: Install the ring C cross-compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - run: cargo check --workspace --all-features --target armv7-unknown-linux-musleabihf
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
      - name: Build the effective app registry
        run: node tools/collect-app-registry.mjs --out generated-app-registry.json
      - run: cargo run --locked -p kobo-cli -- app-check --registry generated-app-registry.json
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
          CFLAGS_armv7_unknown_linux_musleabihf: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
      - name: Require versions for changed app packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            target_branch="$GITHUB_BASE_REF"
          elif [ "$GITHUB_REF_NAME" = main ] || [ "$GITHUB_REF_NAME" = beta ]; then
            target_branch="$GITHUB_REF_NAME"
          else
            target_branch=beta
          fi
          if [ "$target_branch" = beta ]; then
            release_tag=app-catalog-beta
          else
            release_tag=app-catalog
          fi
          mkdir -p published-state
          gh release download "$release_tag" \
            --dir published-state \
            --pattern cobalt-app-catalog.json
          catalog_sha256="$(
            sha256sum published-state/cobalt-app-catalog.json | cut -d' ' -f1
          )"
          provenance_count="$(
            gh release view "$release_tag" --json assets \
              --jq '[.assets[] | select(.name == "cobalt-app-catalog-provenance.json")] | length'
          )"
          if [ "$provenance_count" -eq 1 ]; then
            gh release download "$release_tag" \
              --dir published-state \
              --pattern cobalt-app-catalog-provenance.json
            published_sha="$(
              # shellcheck disable=SC2016
              node -e '
                const fs = require("fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (
                  value.format_version !== 1 ||
                  value.channel !== process.argv[3] ||
                  !/^[0-9a-f]{40}$/.test(value.source_sha) ||
                  value.catalog_sha256 !== process.argv[2]
                ) process.exit(1);
                process.stdout.write(value.source_sha);
              ' \
                published-state/cobalt-app-catalog-provenance.json \
                "$catalog_sha256" \
                "$release_tag"
            )"
          elif [ "$provenance_count" -eq 0 ]; then
            # The first promotion migrates the legacy catalog, which predates
            # provenance assets. Do not use this fallback after provenance is
            # present.
            published_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/apps.yml/runs?branch=${target_branch}&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha')"
            test -n "$published_sha"
          else
            echo "$release_tag has duplicate provenance assets" >&2
            exit 1
          fi
          git cat-file -e "${published_sha}^{commit}"
          node tools/check-app-versions.mjs \
            --registry generated-app-registry.json \
            --published-catalog published-state/cobalt-app-catalog.json \
            --base "$published_sha"

  host-release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cc: ""
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            cc: ""
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            cc: musl-gcc
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            cc: musl-gcc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          targets: ${{ matrix.target }}
      - name: Install Linux host tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release host binary
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.cc }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.cc }}
        run: |
          cargo build --locked --release -p kobo-cli --target "${{ matrix.target }}"
          test -x "target/${{ matrix.target }}/release/kobo"
          echo "built ${{ matrix.platform }}"

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RustSec/advisory-db
          path: advisory-db
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RustSec/advisory-db
          ref: 309ad29d8fe448bf986019e05d47b9e0e29a2218
          path: advisory-db-fallback
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: |
          set +e
          output="$(cargo audit --db advisory-db --no-fetch 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            printf '%s\n' "$output"
          elif printf '%s\n' "$output" | grep -Eq \
            'error loading advisory database|expected RUSTSEC-[0-9-]+ to be in'; then
            printf '%s\n' "$output" >&2
            echo "Current advisory database is malformed; using the last verified snapshot." >&2
            cargo audit --db advisory-db-fallback --no-fetch
          else
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
