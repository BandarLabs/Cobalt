name: App profile review
on:
  push:
    branches: [validation/app-profiles-20261001]
    paths:
      - .github/workflows/profile-review.yml
      - scripts/run-profile-review.py
      - scripts/profile-review-heads.json
permissions:
  contents: read
  actions: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        phase: [after]
        profile: [clara-bw-391, clara-bw-395, clara-hd-376, clara-colour-393, elipsa-2e-389, libra-2-388, libra-colour-390, libra-colour-390-4.46.23836, libra-h2o-384]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
      - name: Run exact source profile routes
        run: |
          args=()
          if [ '${{ matrix.phase }}' = after ]; then
            args=(--repair-only)
          fi
          python3 scripts/run-profile-review.py --profile '${{ matrix.profile }}' --phase '${{ matrix.phase }}' "${args[@]}"
      - name: Upload profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-${{ matrix.phase }}-${{ matrix.profile }}
          path: target/profile-review
          retention-days: 7
          if-no-files-found: warn
