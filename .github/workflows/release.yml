name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          targets: armv7-unknown-linux-musleabihf
      - name: Install the ring C cross-compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - name: Check the tag against the workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fxq "version = \"$version\"" Cargo.toml || {
            echo "tag $GITHUB_REF_NAME does not match the workspace version in Cargo.toml"
            exit 1
          }
      - name: Build the device package
        run: cargo run -p kobo-cli -- package --out dist/KoboRoot.tgz
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
          # Ubuntu's gcc enables _FORTIFY_SOURCE by default, which emits
          # glibc-only *_chk symbols that musl does not carry.
          CFLAGS_armv7_unknown_linux_musleabihf: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
      - name: Name the assets and write checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="cobalt-${version}-KoboRoot.tgz"
          legacy_asset="cobalt-${version}-ClaraBW-KoboRoot.tgz"
          digest="cobalt-${version}.sha256"
          legacy_digest="cobalt-${version}-ClaraBW.sha256"
          mv dist/KoboRoot.tgz "dist/$asset"
          # Existing Clara installations look up these names. Keep aliases
          # until their device-specific updater contract can be retired.
          cp "dist/$asset" "dist/$legacy_asset"
          cp THIRD-PARTY.md dist/
          cd dist
          sha256sum THIRD-PARTY.md "$asset" "$legacy_asset" > "$digest"
          cp "$digest" "$legacy_digest"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="Rename the .tgz to KoboRoot.tgz, copy it into the .kobo folder \
          of a USB-connected supported Kobo reader, and restart the reader. \
          Store applications are published independently from main and do not \
          require a new Cobalt platform release. \
          Verify the download against the .sha256 file first. \
          See docs/INSTALL.md for the full walkthrough."
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Cobalt $version" \
            --notes "$notes" \
            --verify-tag || gh release upload "$GITHUB_REF_NAME" dist/*
