name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One entry per supported device profile. A new profile adds a row.
        device: [ClaraBW]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0
          targets: armv7-unknown-linux-musleabihf
      - name: Install the ring C cross-compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - name: Check the tag against the workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fxq "version = \"$version\"" Cargo.toml || {
            echo "tag $GITHUB_REF_NAME does not match the workspace version in Cargo.toml"
            exit 1
          }
      - name: Build the device package
        run: cargo run -p kobo-cli -- package --out dist/KoboRoot.tgz
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
      - name: Name the assets and write checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="cobalt-${version}-${{ matrix.device }}-KoboRoot.tgz"
          mv dist/KoboRoot.tgz "dist/$asset"
          cp THIRD-PARTY.md dist/
          cd dist && sha256sum * > "cobalt-${version}-${{ matrix.device }}.sha256"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="Rename the .tgz to KoboRoot.tgz, copy it into the .kobo folder \
          of a USB-connected ${{ matrix.device }}, and restart the reader. \
          Verify the download against the .sha256 file first. \
          See docs/INSTALL.md for the full walkthrough."
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Cobalt $version" \
            --notes "$notes" \
            --verify-tag || gh release upload "$GITHUB_REF_NAME" dist/*
