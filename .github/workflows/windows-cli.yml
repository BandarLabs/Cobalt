name: Windows

# The Windows build and test takes most of an hour, so it runs on the pull
# request that cuts a beta release (a `release/` branch) and when started by
# hand, not on every pull request and every merge. Each change still meets
# Windows before it reaches anyone, at the cut that ships it; a change that
# worries you can be checked earlier by starting this workflow on its branch.
on:
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-test:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: windows-2022
    # Setup alone takes about twenty minutes, and the whole job has finished
    # between 46 and 59 minutes, so an hour cut off slow runners mid-test.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          targets: armv7-unknown-linux-musleabihf
          components: clippy

      # The contributor path for the reader build: with no ARM gcc on the
      # runner, setup's zig fallback must find zig, wrap it, and compile the
      # TLS stack's C for armv7 musl. This is the exact journey the setup
      # error text sends Windows users on, so it runs here on every push.
      # The error text's download route: the pinned zig zip, hash-checked
      # against the value the release workflow already reviews, unpacked and
      # put on PATH. The winget route stays in the error text for people -
      # Store frameworks make it too brittle to exercise on a hosted runner.
      - name: Install zig the way the setup error text describes
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zigArchive = "$env:TEMP\zig.zip"
          $zigDigest = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $zigUrls = @(
            'https://pkg.hexops.org/zig/zig-x86_64-windows-0.16.0.zip?source=cobalt-ci',
            'https://ziglang.freetls.fastly.net/zig-x86_64-windows-0.16.0.zip?source=cobalt-ci',
            'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          )
          $zigDownloaded = $false
          foreach ($zigUrl in $zigUrls) {
            try {
              Invoke-WebRequest -Uri $zigUrl -OutFile $zigArchive -TimeoutSec 120
              $hash = (Get-FileHash $zigArchive -Algorithm SHA256).Hash.ToLower()
              if ($hash -eq $zigDigest) {
                $zigDownloaded = $true
                break
              }
              Write-Warning "Zig archive from $zigUrl had unexpected hash $hash"
            } catch {
              Write-Warning "Could not obtain the pinned Zig archive from ${zigUrl}: $_"
            }
            Remove-Item $zigArchive -Force -ErrorAction SilentlyContinue
          }
          if (-not $zigDownloaded) {
            throw 'No source supplied the pinned Zig archive'
          }
          Expand-Archive "$env:TEMP\zig.zip" -DestinationPath "$env:TEMP\zig"
          # A fresh step is the error text's "open a new terminal": GITHUB_PATH
          # hands the directory to every step that follows.
          Add-Content $env:GITHUB_PATH "$env:TEMP\zig\zig-x86_64-windows-0.16.0"

      - name: Build the device binaries through the zig fallback
        run: cargo run --locked -p kobo-cli -- build --device

      # Native MSVC build: the tests execute on the runner, so every
      # cfg(windows) path that has unit coverage is runtime-verified here,
      # not just compiled.
      - name: Test the workspace on Windows
        run: cargo test --workspace --all-targets --locked --no-fail-fast  # report every failing crate at once, not one layer per run

      # The host job lints only what compiles on Linux, so every cfg(windows)
      # arm would otherwise reach beta without the workspace's clippy rules
      # ever reading it. Both runs deny warnings exactly as the host job does.
      # device-write stays gated exactly as upstream; the CLI's gated verbs
      # are host-side ssh orchestration, so they must still build for a
      # Windows host. Device-side device-write crates target ARM Linux and
      # are not part of this job.
      - name: Lint the workspace as Windows compiles it
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint the CLI with device-write on Windows
        run: cargo clippy -p kobo-cli --features device-write --all-targets --locked -- -D warnings

      - name: Build the CLI artifact
        run: cargo build --release -p kobo-cli --locked

      - name: Smoke the built CLI
        shell: pwsh
        run: |
          .\target\release\kobo.exe --version
          Get-FileHash .\target\release\kobo.exe -Algorithm SHA256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobalt-windows-cli
          path: target/release/kobo.exe
          if-no-files-found: error
