name: Windows

on:
  push:
    branches: [windows-cli]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1

      # Native MSVC build: the tests execute on the runner, so every
      # cfg(windows) path that has unit coverage is runtime-verified here,
      # not just compiled.
      - name: Test the workspace on Windows
        run: cargo test --workspace --all-targets --locked

      # device-write stays gated exactly as upstream; the CLI's gated verbs
      # are host-side ssh orchestration, so they must still compile for a
      # Windows host. Device-side device-write crates target ARM Linux and
      # are not part of this job.
      - name: Check the CLI with device-write on Windows
        run: cargo check -p kobo-cli --features device-write --all-targets --locked

      - name: Build the CLI artifact
        run: cargo build --release -p kobo-cli --locked

      - name: Smoke the built CLI
        shell: pwsh
        run: |
          .\target\release\kobo.exe --version
          Get-FileHash .\target\release\kobo.exe -Algorithm SHA256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobalt-windows-cli
          path: target/release/kobo.exe
          if-no-files-found: error
