name: Windows

on:
  push:
    branches: [beta, windows-cli]
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          targets: armv7-unknown-linux-musleabihf

      # The contributor path for the reader build: with no ARM gcc on the
      # runner, setup's zig fallback must find zig, wrap it, and compile the
      # TLS stack's C for armv7 musl. This is the exact journey the setup
      # error text sends Windows users on, so it runs here on every push.
      # The error text's download route: the pinned zig zip, hash-checked
      # against the value the release workflow already reviews, unpacked and
      # put on PATH. The winget route stays in the error text for people -
      # Store frameworks make it too brittle to exercise on a hosted runner.
      - name: Install zig the way the setup error text describes
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile "$env:TEMP\zig.zip"
          $hash = (Get-FileHash "$env:TEMP\zig.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') {
            throw "zig archive hash mismatch: $hash"
          }
          Expand-Archive "$env:TEMP\zig.zip" -DestinationPath "$env:TEMP\zig"
          # A fresh step is the error text's "open a new terminal": GITHUB_PATH
          # hands the directory to every step that follows.
          Add-Content $env:GITHUB_PATH "$env:TEMP\zig\zig-x86_64-windows-0.16.0"

      - name: Build the device binaries through the zig fallback
        run: cargo run --locked -p kobo-cli -- build --device

      # Native MSVC build: the tests execute on the runner, so every
      # cfg(windows) path that has unit coverage is runtime-verified here,
      # not just compiled.
      - name: Test the workspace on Windows
        run: cargo test --workspace --all-targets --locked --no-fail-fast  # report every failing crate at once, not one layer per run

      # device-write stays gated exactly as upstream; the CLI's gated verbs
      # are host-side ssh orchestration, so they must still compile for a
      # Windows host. Device-side device-write crates target ARM Linux and
      # are not part of this job.
      - name: Check the CLI with device-write on Windows
        run: cargo check -p kobo-cli --features device-write --all-targets --locked

      - name: Build the CLI artifact
        run: cargo build --release -p kobo-cli --locked

      - name: Smoke the built CLI
        shell: pwsh
        run: |
          .\target\release\kobo.exe --version
          Get-FileHash .\target\release\kobo.exe -Algorithm SHA256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobalt-windows-cli
          path: target/release/kobo.exe
          if-no-files-found: error
