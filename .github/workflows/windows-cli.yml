name: Windows

on:
  push:
    branches: [windows-cli]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          targets: armv7-unknown-linux-musleabihf

      # The contributor path for the reader build: with no ARM gcc on the
      # runner, setup's zig fallback must find zig, wrap it, and compile the
      # TLS stack's C for armv7 musl. This is the exact journey the setup
      # error text sends Windows users on, so it runs here on every push.
      - name: Install zig the way the setup error text describes
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            # The error text's own fallback: App Installer provides winget.
            # The Store is the GUI route; this installs the same package.
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx -OutFile "$env:TEMP\VCLibs.appx"
            try { Add-AppxPackage "$env:TEMP\VCLibs.appx" -ErrorAction Stop } catch { Write-Host "VCLibs already present: $($_.Exception.Message)" }
            Invoke-WebRequest -Uri https://github.com/microsoft/microsoft-ui-xaml/releases/download/v2.8.6/Microsoft.UI.Xaml.2.8.x64.appx -OutFile "$env:TEMP\UIXaml.appx"
            try { Add-AppxPackage "$env:TEMP\UIXaml.appx" -ErrorAction Stop } catch { Write-Host "UI.Xaml already present: $($_.Exception.Message)" }
            Invoke-WebRequest -Uri https://aka.ms/getwinget -OutFile "$env:TEMP\AppInstaller.msixbundle"
            Add-AppxPackage "$env:TEMP\AppInstaller.msixbundle"
            # The error text says "open a new terminal": the fresh winget alias
            # only lands in a new session's PATH, so refresh it the same way.
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          }
          winget install --id zig.zig -e --source winget --accept-package-agreements --accept-source-agreements

      - name: Build the device binaries through the zig fallback
        run: cargo run --locked -p kobo-cli -- build --device

      # Native MSVC build: the tests execute on the runner, so every
      # cfg(windows) path that has unit coverage is runtime-verified here,
      # not just compiled.
      - name: Test the workspace on Windows
        run: cargo test --workspace --all-targets --locked --no-fail-fast  # report every failing crate at once, not one layer per run

      # device-write stays gated exactly as upstream; the CLI's gated verbs
      # are host-side ssh orchestration, so they must still compile for a
      # Windows host. Device-side device-write crates target ARM Linux and
      # are not part of this job.
      - name: Check the CLI with device-write on Windows
        run: cargo check -p kobo-cli --features device-write --all-targets --locked

      - name: Build the CLI artifact
        run: cargo build --release -p kobo-cli --locked

      - name: Smoke the built CLI
        shell: pwsh
        run: |
          .\target\release\kobo.exe --version
          Get-FileHash .\target\release\kobo.exe -Algorithm SHA256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobalt-windows-cli
          path: target/release/kobo.exe
          if-no-files-found: error
