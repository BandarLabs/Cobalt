# Actions are pinned by commit, and a pin that is never moved is a pin to an
# unmaintained version. Dependabot keeps the pins current, against beta like
# every other change.
#
# Cargo is not listed: dependency updates are taken by hand, against the
# device toolchain pin. Advisories are caught by the audit job on every push.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
