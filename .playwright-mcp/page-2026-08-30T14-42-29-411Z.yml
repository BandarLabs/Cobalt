  - generic [ref=f2e234]:
    - paragraph [ref=f2e235]: Safety
    - heading "Your original reader stays available." [level=2] [ref=f2e236]
    - paragraph [ref=f2e237]: Cobalt does not replace Kobo's boot chain. Normal panel-write entry points require an exact hardware and firmware match, and a reboot returns to the stock reader. The first installation does modify files on the user storage partition, and it is provided without warranty.
    - paragraph [ref=f2e238]:
      - text: The Clara BW N365, Clara BW P365 refresh, Clara Colour N367, Elipsa 2E N605, Clara HD N249, Libra 2 N418, and Libra Colour N428 profiles are supported at the exact firmware and kernel versions in the
      - link "device support matrix" [ref=f2e239] [cursor=pointer]:
        - /url: https://github.com/BandarLabs/Cobalt/blob/main/docs/DEVICES.md#device-support-matrix
      - text: . P365 support inherits the attended N365 evidence after its read-only doctor report matched the same panel, touch, firmware, and kernel. Other identity or firmware combinations remain unsupported until separately verified. Cobalt is an independent project, not affiliated with Rakuten Kobo.
