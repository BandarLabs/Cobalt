    - generic [ref=f2e202]:
      - paragraph [ref=f2e203]: The Store
      - heading "Add an app without reconnecting USB." [level=2] [ref=f2e204]
      - paragraph [ref=f2e205]: Browse available apps on the reader, install one over Wi-Fi, and remove it when you no longer want it. App updates arrive without reinstalling Cobalt.
      - paragraph [ref=f2e206]: Every package is checked before it opens. An interrupted install or update leaves the working version in place.
      - paragraph [ref=f2e207]: Cobalt updates remain separate from app updates, so the Store cannot replace the platform itself.
      - paragraph [ref=f2e208]:
        - link "Build and publish an app" [ref=f2e209] [cursor=pointer]:
          - /url: sdk.html
