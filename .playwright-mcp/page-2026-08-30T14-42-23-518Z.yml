      - generic [ref=f1e573]:
        - heading "Testing and shipping" [level=2] [ref=f1e574]
        - code [ref=f1e576]: "# Browser simulator from an app directory kobo dev # Host runtime cargo run -p kobo-cli -- run --sim --app my-app # Drive taps, typing, expectations and screenshots cargo run -p kobo-cli -- drive --script tour.kobo --shots target/shots # Targeted application tests cargo test -p kobo-my-app # Package a device build cargo run -p kobo-cli -- package"
        - paragraph [ref=f1e577]: The simulator uses the production layout, renderer, hit testing and refresh planner. Failure scenarios cover offline, timeout, low battery, denied capability, missing credentials, storage pressure and image-cache pressure.
        - generic [ref=f1e578]:
