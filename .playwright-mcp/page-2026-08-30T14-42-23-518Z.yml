      - generic [ref=f1e582]:
        - heading "Platform constraints" [level=2] [ref=f1e583]
        - generic [ref=f1e584]:
          - generic [ref=f1e585]:
            - heading "Callback duration" [level=3] [ref=f1e586]
            - paragraph [ref=f1e587]: Callbacks must return quickly. Network, files, sleeps and device operations use asynchronous requests.
          - generic [ref=f1e588]:
            - heading "Brokered access" [level=3] [ref=f1e589]
            - paragraph [ref=f1e590]: Applications do not open sockets, device nodes, shared paths or processes. Runtime requests return a result or refusal.
          - generic [ref=f1e591]:
            - heading "Bounded data" [level=3] [ref=f1e592]
            - paragraph [ref=f1e593]: Rows, cells, choices, pictures, tasks, keys and wire strings have explicit limits. Diagnostics report truncation and overflow.
          - generic [ref=f1e594]:
            - heading "Pagination" [level=3] [ref=f1e595]
            - paragraph [ref=f1e596]: Long prose, rows and tiles are measured into pages. The SDK does not provide continuous scrolling.
          - generic [ref=f1e597]:
            - heading "Credentials" [level=3] [ref=f1e598]
            - paragraph [ref=f1e599]: Requests name runtime-held credentials. Values do not enter application memory or follow redirects.
          - generic [ref=f1e600]:
            - heading "Hardware profiles" [level=3] [ref=f1e601]
            - paragraph [ref=f1e602]: Device support requires an exact profile. Unknown models are refused.
