[workspace]
members = [
    "crates/kobo-abi",
    "crates/kobo-app-store",
    "crates/kobo-bookview",
    "crates/kobo-cli",
    "crates/kobo-doc",
    "crates/kobo-doctor",
    "crates/kobo-dict",
    "crates/kobo-hal",
    "crates/kobo-html",
    "crates/kobo-image",
    "crates/kobo-json",
    "crates/kobo-net",
    "crates/kobo-opds",
    "crates/kobo-term",
    "crates/kobo-text",
    "crates/kobo-policy",
    "crates/kobo-profile",
    "crates/kobo-read",
    "crates/kobo-protocol",
    "crates/kobo-sdk",
    "crates/kobo-shell",
    "crates/kobo-sidekickd",
    "crates/kobo-sim",
    "crates/kobo-smoke",
    "crates/kobo-tap",
    "crates/kobo-ui",
    "crates/kobo-guard",
    "crates/kobo-handoff",
    "crates/kobo-xml",
    "crates/kobod",
    "examples/brief",
    "examples/audiobook",
    "examples/chat",
    "examples/rss",
    "examples/todo",
    "examples/tictactoe",
    "examples/terminal",
    "examples/gallery",
    "examples/gutenbird",
    "examples/hello",
    "examples/hn",
    "examples/books",
    "examples/launcher",
    "examples/magnet",
    "examples/settings",
    "examples/sidekick",
    "examples/store",
    "apps/*",
    "tools/icon-import",
]
resolver = "2"

[workspace.package]
version = "0.3.6"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-only"
repository = "https://github.com/BandarLabs/Cobalt"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
