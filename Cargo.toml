[workspace]
members = [
    "crates/kobo-abi",
    "crates/kobo-cli",
    "crates/kobo-doctor",
    "crates/kobo-hal",
    "crates/kobo-json",
    "crates/kobo-net",
    "crates/kobo-text",
    "crates/kobo-policy",
    "crates/kobo-profile",
    "crates/kobo-protocol",
    "crates/kobo-sdk",
    "crates/kobo-sim",
    "crates/kobo-smoke",
    "crates/kobo-ui",
    "crates/kobo-guard",
    "crates/kobo-handoff",
    "crates/kobod",
    "examples/chat",
    "examples/counter",
    "examples/tictactoe",
    "examples/hello",
    "examples/gallery",
    "examples/gutenshelf",
    "examples/launcher",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kobo-platform/kobo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
